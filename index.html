<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#101a3c">
<title>Oi! — Moonlight Dash</title>
<style>
:root{color-scheme:dark;--ink:#f7f5ff;--muted:#a9b5d8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#101a3c;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;overscroll-behavior:none}body{min-height:100svh;display:flex;justify-content:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% -10%,#304477 0,#192750 45%,#101a3c 100%);padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.shell{width:min(100%,1040px);padding:clamp(12px,3vh,28px) 0 16px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px)}.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:17px;background:linear-gradient(145deg,#baff92,#58d3a6);display:grid;place-items:center;color:#183558;font-size:27px;font-weight:1000;box-shadow:0 6px 22px #75efb633;transform:rotate(-5deg)}h1{font-size:clamp(22px,5vw,32px);line-height:1;margin:0;letter-spacing:-1.4px}.tagline{font-size:12px;color:var(--muted);margin-top:5px;letter-spacing:.04em}.scoreboard{display:flex;gap:8px}.pill{min-width:72px;padding:8px 13px;border:1px solid #ffffff1b;border-radius:14px;background:#ffffff0b;text-align:center}.pill small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.14em}.pill strong{font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}.frame{width:100%;position:relative;border-radius:24px;padding:7px;background:linear-gradient(135deg,#ffffff35,#ffffff08 48%,#92b9ff22);box-shadow:0 22px 65px #060e2c99,0 0 0 1px #ffffff12;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:960/560;border-radius:18px;background:#172858;touch-action:none}.controls{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px}.hint{font-size:13px;color:var(--muted);line-height:1.45}.hint b{color:#f4f2ff}.action{font:inherit;font-weight:900;color:#183356;background:linear-gradient(180deg,#c8ff9b,#83edb2);border:0;border-radius:18px;padding:14px 25px;min-width:150px;box-shadow:0 6px 0 #429a8a,0 12px 25px #0a102c77;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s}.action:active{transform:translateY(4px);box-shadow:0 2px 0 #429a8a}.action:focus-visible{outline:3px solid #fff;outline-offset:3px}.foot{color:#8190b8;font-size:10px;text-align:center;letter-spacing:.07em;margin-top:-3px}@media(max-width:600px){body{padding-left:12px;padding-right:12px}.shell{gap:12px;padding-top:12px}.top{gap:6px}.brand{gap:9px;min-width:0}.logo{width:41px;height:41px;flex:0 0 41px;border-radius:14px}h1{font-size:clamp(17px,5vw,24px);letter-spacing:-1px}.tagline{font-size:10px}.pill{min-width:50px;padding:7px 8px}.pill strong{font-size:16px}.scoreboard{gap:5px}.frame{padding:5px;border-radius:19px}canvas{border-radius:15px}.hint{font-size:11px}.action{min-width:132px;padding:13px 19px}}@media(max-height:560px) and (orientation:landscape){.shell{padding-top:7px;gap:8px}.top .logo{width:37px;height:37px}.frame{max-height:calc(100svh - 115px);width:auto;max-width:100%}.frame canvas{height:min(calc((100svh - 125px)*.58),60vh);width:auto;max-width:100%;aspect-ratio:960/560}.foot{display:none}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Oi! <span style="color:#a7f5be">Moonlight Dash</span></h1><div class="tagline">A tiny night run beneath a giant moon</div></div></div><div class="scoreboard"><div class="pill"><small>SCORE</small><strong id="score">000</strong></div><div class="pill"><small>BEST</small><strong id="best">000</strong></div></div></header><div class="frame"><canvas id="game" aria-label="Oi Moonlight Dash game"></canvas></div><section class="controls"><div class="hint" id="hint"><b>Tap to hop</b> · Dodge the sleepy slimes<br>Catch moon-stars for bonus points</div><button class="action" id="play">Let’s run! <span aria-hidden="true">↗</span></button></section><div class="foot">ONE BUTTON · BIG MOON ENERGY</div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),playBtn=document.querySelector('#play'),hint=document.querySelector('#hint');
const W=960,H=560,ground=435;let state='ready',last=0,elapsed=0,score=0,best=Number(localStorage.getItem('oi-best')||0),speed=330,spawn=1.1,starSpawn=2.2,obstacles=[],stars=[],particles=[];bestEl.textContent=String(best).padStart(3,'0');const player={x:205,y:ground,r:27,vy:0,run:0,blink:0};let dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize,{passive:true});resize();function rand(a,b){return a+Math.random()*(b-a)}
function reset(){score=0;speed=330;spawn=.9;starSpawn=1.7;elapsed=0;obstacles=[];stars=[];particles=[];player.y=ground;player.vy=0;player.run=0;player.blink=0;scoreEl.textContent='000'}
function start(){if(state==='run')return;reset();state='run';playBtn.textContent='Jump!  ↑';hint.innerHTML='<b>Tap anywhere</b> · or press space';jump();last=performance.now()}
function jump(){if(state==='ready'){start();return}if(state!=='run')return;if(player.y>=ground-1){player.vy=-710;burst(player.x,player.y-15,'#c7ff9a',7,130)}}
function endGame(){state='over';const val=Math.floor(score);if(val>best){best=val;localStorage.setItem('oi-best',best);bestEl.textContent=String(best).padStart(3,'0')}playBtn.textContent='Run it back ↻';hint.innerHTML='<b>Oof! One more try?</b> · Tap to hop over the slimes';burst(player.x,player.y-18,'#ffb3a5',18,260)}
playBtn.addEventListener('click',()=>state==='run'?jump():start());canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='ready'||state==='over')start();else jump()},{passive:false});addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(state!=='run')start();else jump()}if(e.code==='Enter'&&state!=='run')start()});
function burst(x,y,color,n=8,power=150){for(let i=0;i<n;i++){let a=rand(-Math.PI,0);particles.push({x,y,vx:Math.cos(a)*rand(power*.25,power),vy:Math.sin(a)*rand(power*.25,power),life:rand(.35,.8),max:.8,color,r:rand(2,5)})}}
function addObstacle(){const tall=Math.random()<.25;obstacles.push({x:W+30,w:tall?54:rand(44,63),h:tall?rand(65,83):rand(34,48),type:tall?'tower':'slime',phase:rand(0,6)})}function addStar(){stars.push({x:W+20,y:rand(270,350),r:13,phase:rand(0,6)})}
function update(dt){elapsed+=dt;player.run+=dt*speed/54;player.blink=Math.max(0,player.blink-dt);if(state==='run'){speed=Math.min(570,330+elapsed*9);score+=dt*(10+elapsed*.8);scoreEl.textContent=String(Math.floor(score)).padStart(3,'0');player.vy+=1750*dt;player.y=Math.min(ground,player.y+player.vy*dt);if(player.y>=ground){player.y=ground;player.vy=0}spawn-=dt;if(spawn<=0){addObstacle();spawn=rand(.95,1.45)*Math.max(.67,1-(speed-330)/1100)}starSpawn-=dt;if(starSpawn<=0){addStar();starSpawn=rand(2,3.2)}obstacles.forEach(o=>o.x-=speed*dt);obstacles=obstacles.filter(o=>o.x+o.w>-30);stars.forEach(s=>s.x-=speed*dt);stars=stars.filter(s=>s.x>-30);
 for(const o of obstacles){const left=player.x-17,right=player.x+17,top=player.y-39,bottom=player.y-1;if(right>o.x+5&&left<o.x+o.w-5&&bottom>ground-o.h+5&&top<ground){endGame();break}}
 for(let i=stars.length-1;i>=0;i--){const s=stars[i],dx=s.x-player.x,dy=s.y-(player.y-23);if(dx*dx+dy*dy<41*41){score+=50;burst(s.x,s.y,'#ffe68a',11,190);stars.splice(i,1)}}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=390*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function randStable(i,min,max){return min+Math.abs(Math.sin(i*42.7))*(max-min)}
function drawBackground(t){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c3268');g.addColorStop(.58,'#31457c');g.addColorStop(1,'#66749b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const glow=ctx.createRadialGradient(744,142,8,744,142,190);glow.addColorStop(0,'#fff7d755');glow.addColorStop(1,'#fff7d700');ctx.fillStyle=glow;ctx.fillRect(530,0,420,360);ctx.fillStyle='#fff4c9';ctx.beginPath();ctx.arc(744,142,56,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0dfa9';ctx.beginPath();ctx.arc(762,123,9,0,7);ctx.arc(718,158,6,0,7);ctx.arc(754,169,4,0,7);ctx.fill();
 for(let i=0;i<42;i++){let x=(i*173+37)%W,y=(i*83+21)%310;ctx.globalAlpha=.45+.55*Math.sin(t*1.7+i*2.2);ctx.fillStyle=i%5===0?'#ffe89a':'#dce8ff';ctx.beginPath();ctx.arc(x,y,i%5===0?2.1:1.3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.fillStyle='#344978';ctx.beginPath();ctx.moveTo(0,362);for(let x=0;x<=W;x+=40)ctx.lineTo(x,346+Math.sin(x*.012+t*.22)*17+Math.sin(x*.027)*8);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#283c6b';ctx.beginPath();ctx.moveTo(0,396);for(let x=0;x<=W;x+=35)ctx.lineTo(x,374+Math.sin(x*.013+t*.3+1)*14+Math.cos(x*.023)*7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 for(let i=0;i<9;i++){let x=((i*147-(t*24)%147)+W)%W-35,h=65+(i*31%65),y=ground-h;ctx.fillStyle=i%2?'#20345f':'#263a65';ctx.fillRect(x,y,48,h);for(let wy=y+14;wy<ground-12;wy+=22)for(let wx=x+10;wx<x+43;wx+=18){ctx.fillStyle=(i+Math.floor(wy/22))%3?'#edda8b88':'#a9ccf15c';ctx.fillRect(wx,wy,5,8)}}
 ctx.fillStyle='#182a50';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#9ee5bb';ctx.fillRect(0,ground,W,6);ctx.fillStyle='#2d4671';ctx.fillRect(0,ground+6,W,5);const off=state==='run'?elapsed*speed*.5:t*32;ctx.fillStyle='#46628c';for(let i=0;i<15;i++){let x=((i*91-off)%1100+1100)%1100-70;ctx.fillRect(x,ground+33+(i%3)*23,randStable(i,16,39),3)}ctx.strokeStyle='#8de4ae';ctx.lineWidth=2;for(let i=0;i<26;i++){let x=((i*57-(state==='run'?elapsed*speed:t*18))%1030+1030)%1030-30;ctx.beginPath();ctx.moveTo(x,ground+5);ctx.lineTo(x-3,ground-1-(i%3)*2);ctx.moveTo(x,ground+5);ctx.lineTo(x+4,ground-2);ctx.stroke()}}
function drawPlayer(t){const px=player.x,py=player.y,inAir=py<ground-2,bob=inAir?0:Math.sin(player.run*1.8)*3,y=py+bob;ctx.globalAlpha=Math.max(.12,.28-(ground-py)*.001);ctx.fillStyle='#08152e';ctx.beginPath();ctx.ellipse(px,ground+2,29-Math.min(15,(ground-py)*.08),7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.save();ctx.translate(px,y);ctx.rotate(inAir?-.08:Math.sin(player.run)*.035);ctx.fillStyle='#80edb6';ctx.beginPath();ctx.ellipse(-13,-36,10,19,-.32,0,Math.PI*2);ctx.ellipse(14,-36,10,19,.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b4ffce';ctx.beginPath();ctx.ellipse(-13,-37,4,10,-.32,0,Math.PI*2);ctx.ellipse(14,-37,4,10,.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a1f7c3';ctx.beginPath();ctx.ellipse(0,-24,27,26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d5ffd9';ctx.beginPath();ctx.ellipse(0,-13,15,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#19365a';ctx.beginPath();ctx.ellipse(-9,-27,2.4,4,0,0,Math.PI*2);ctx.ellipse(9,-27,2.4,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9fa4';ctx.beginPath();ctx.arc(-15,-21,3.2,0,7);ctx.arc(15,-21,3.2,0,7);ctx.fill();ctx.strokeStyle='#315676';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-3,-18);ctx.quadraticCurveTo(0,-14,3,-18);ctx.stroke();let stride=inAir?0:Math.sin(player.run*2.4)*5;ctx.fillStyle='#63d9a8';rr(-20+stride,-5,15,9,5);ctx.fill();rr(5-stride,-5,15,9,5);ctx.fill();ctx.fillStyle='#ffc86f';ctx.beginPath();ctx.moveTo(-19,-38);ctx.quadraticCurveTo(0,-47,18,-37);ctx.lineTo(10,-32);ctx.quadraticCurveTo(0,-37,-12,-32);ctx.fill();ctx.restore()}
function drawObstacle(o,t){const x=o.x,y=ground-o.h;if(o.type==='slime'){ctx.fillStyle='#ff987f';ctx.beginPath();ctx.moveTo(x,y+o.h);ctx.quadraticCurveTo(x-5,y+o.h-4,x+2,y+o.h-22);ctx.quadraticCurveTo(x+8,y-7,x+o.w*.55,y+3+Math.sin(t*6+o.phase)*2);ctx.quadraticCurveTo(x+o.w+4,y-2,x+o.w,y+o.h);ctx.closePath();ctx.fill();ctx.fillStyle='#813e68';ctx.beginPath();ctx.arc(x+o.w*.36,y+o.h*.52,2.4,0,7);ctx.arc(x+o.w*.68,y+o.h*.52,2.4,0,7);ctx.fill();ctx.strokeStyle='#813e68';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+o.w*.52,y+o.h*.66,4,0,Math.PI);ctx.stroke();ctx.fillStyle='#ffc5a2';ctx.beginPath();ctx.arc(x+7,y+o.h*.3,3,0,7);ctx.fill()}else{ctx.fillStyle='#de956e';rr(x,y+5,o.w,o.h-5,10);ctx.fill();ctx.fillStyle='#f1b287';rr(x+6,y+9,o.w-12,o.h-18,7);ctx.fill();ctx.fillStyle='#be745f';ctx.beginPath();ctx.arc(x+o.w*.34,y+o.h*.42,2.5,0,7);ctx.arc(x+o.w*.65,y+o.h*.42,2.5,0,7);ctx.fill();ctx.strokeStyle='#aa665a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+o.w*.5,y+o.h*.55,4,0,Math.PI);ctx.stroke();ctx.fillStyle='#ffda91';ctx.beginPath();ctx.arc(x+o.w*.72,y+o.h*.2,4,0,7);ctx.fill()}}
function drawStar(s,t){ctx.save();ctx.translate(s.x,s.y+Math.sin(t*4+s.phase)*5);ctx.rotate(Math.sin(t*2+s.phase)*.18);ctx.shadowColor='#ffe88a';ctx.shadowBlur=18;ctx.fillStyle='#ffe383';ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?s.r*.43:s.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff8c6';ctx.beginPath();ctx.arc(-3,-4,2.7,0,7);ctx.fill();ctx.restore()}
function drawOverlay(){if(state==='run')return;ctx.fillStyle='#101d43a8';ctx.fillRect(0,0,W,H);const px=255,py=state==='ready'?118:135,pw=450,ph=state==='ready'?284:246;ctx.fillStyle='#182a57ef';rr(px,py,pw,ph,27);ctx.fill();ctx.strokeStyle='#ffffff2a';ctx.lineWidth=2;rr(px+1,py+1,pw-2,ph-2,26);ctx.stroke();ctx.textAlign='center';if(state==='ready'){ctx.fillStyle='#ffe68d';ctx.font='bold 15px system-ui';ctx.fillText('✦  THE NIGHT IS YOURS  ✦',480,163);ctx.fillStyle='#f8f6ff';ctx.font='900 48px ui-rounded,system-ui';ctx.fillText('Oi!',480,224);ctx.fillStyle='#b9c9ed';ctx.font='600 17px system-ui';ctx.fillText('Hop over the sleepy slimes.',480,258);ctx.fillText('Collect stars. See how far you get!',480,284);ctx.fillStyle='#9bf0bb';ctx.beginPath();ctx.arc(480,327,26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#25446a';ctx.font='bold 23px system-ui';ctx.fillText('↑',480,335);ctx.fillStyle='#dce6ff';ctx.font='700 13px system-ui';ctx.fillText('TAP TO START',480,376)}else{ctx.fillStyle='#ffae9b';ctx.font='bold 14px system-ui';ctx.fillText('THAT WAS A NICE LITTLE RUN',480,178);ctx.fillStyle='#f8f6ff';ctx.font='900 38px ui-rounded,system-ui';ctx.fillText('Bonk!',480,230);ctx.fillStyle='#bdc9e6';ctx.font='600 16px system-ui';ctx.fillText('You scored',480,263);ctx.fillStyle='#ffe486';ctx.font='900 39px ui-rounded,system-ui';ctx.fillText(String(Math.floor(score)).padStart(3,'0'),480,311);ctx.fillStyle='#a5efbd';ctx.font='bold 13px system-ui';ctx.fillText('TAP TO TRY AGAIN',480,350)}}
function draw(t){drawBackground(t);stars.forEach(s=>drawStar(s,t));obstacles.forEach(o=>drawObstacle(o,t));drawPlayer(t);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawOverlay()}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw(now/1000);requestAnimationFrame(frame)}requestAnimationFrame(now=>{last=now;frame(now)});
})();
</script></body></html>
